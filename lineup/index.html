<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <title>跆拳道搏擊出線表</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #0f0f1a;
      --card-bg: #1a1a2e;
      --blue: #2563eb;
      --blue-dark: #1e40af;
      --red: #dc2626;
      --red-dark: #991b1b;
      --green: #16a34a;
      --yellow: #ca8a04;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
      overscroll-behavior-y: contain;
    }

    /* Header */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
      margin-right: 4px;
      animation: pulse 2s infinite;
    }

    .sync-dot.error {
      background: var(--red);
      animation: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Filters */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .filters select,
    .filters input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      min-width: 0;
    }

    .filters select {
      flex: 1;
      min-width: 100px;
    }

    .filters input {
      flex: 2;
      min-width: 140px;
    }

    /* Match list */
    .match-list {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .match-card {
      background: var(--card-bg);
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid var(--border);
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
    }

    .match-card:active {
      transform: scale(0.985);
    }

    /* 未完成：較亮、有強調邊框 */
    .match-card.pending {
      border-color: #475569;
      box-shadow: 0 0 0 1px rgba(148, 163, 184, 0.15);
    }

    /* 進行中：黃色強調 */
    .match-card.ongoing {
      border-color: #ca8a04;
      box-shadow: 0 0 12px rgba(202, 138, 4, 0.25);
    }

    /* 已完成：明顯變暗 + 綠色邊 */
    .match-card.completed {
      opacity: 0.72;
      border-color: #166534;
      background: #12121f;
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: rgba(0,0,0,0.3);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .match-id {
      font-weight: 700;
      color: var(--text);
      font-size: 0.85rem;
    }

    .match-meta {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .badge {
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .badge-status-未開始 { background: #334155; color: #e2e8f0; }
    .badge-status-進行中 { background: #854d0e; color: #fef08a; }
    .badge-status-已完成 { background: #14532d; color: #86efac; }

    .athletes {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0;
      min-height: 100px;
    }

    .athlete {
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
    }

    .athlete.blue {
      background: linear-gradient(135deg, rgba(37,99,235,0.18), transparent);
      border-right: 1px solid var(--border);
      text-align: left;
    }

    .athlete.red {
      background: linear-gradient(225deg, rgba(220,38,38,0.18), transparent);
      border-left: 1px solid var(--border);
      text-align: right;
    }

    /* 勝方明顯標示 */
    .athlete.winner {
      background: linear-gradient(135deg, rgba(22,163,74,0.45), rgba(22,163,74,0.15)) !important;
    }

    .athlete.winner.red {
      background: linear-gradient(225deg, rgba(22,163,74,0.45), rgba(22,163,74,0.15)) !important;
    }

    .athlete.winner::after {
      content: "WIN";
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #4ade80;
      background: rgba(0,0,0,0.55);
      padding: 3px 8px;
      border-radius: 5px;
      z-index: 2;
    }

    /* 藍勝：放在藍方區域中間偏右（靠近中央） */
    .athlete.blue.winner::after {
      right: 10px;
      left: auto;
    }

    /* 紅勝：放在紅方區域中間偏左（靠近中央） */
    .athlete.red.winner::after {
      left: 10px;
      right: auto;
    }

    /* 負方變暗 */
    .athlete.loser {
      opacity: 0.55;
    }

    .athlete-name {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 3px;
      word-break: break-all;
      line-height: 1.25;
    }

    .athlete.winner .athlete-name {
      color: #bbf7d0;
    }

    .athlete-info {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.35;
    }

    .vs {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 700;
      background: rgba(0,0,0,0.25);
      min-width: 42px;
    }

    .vs-result {
      font-size: 0.9rem;
      margin-top: 4px;
      font-weight: 800;
    }

    .result-win-blue { color: #60a5fa; }
    .result-win-red { color: #f87171; }

    .category-bar {
      padding: 6px 12px;
      font-size: 0.72rem;
      color: var(--text-muted);
      background: rgba(0,0,0,0.2);
      display: flex;
      justify-content: space-between;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal h3 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 1.15rem;
    }

    .modal-match-info {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-btn {
      padding: 15px;
      border-radius: 12px;
      border: none;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      color: white;
    }

    .modal-btn.blue { background: var(--blue); }
    .modal-btn.red { background: var(--red); }
    .modal-btn.cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      margin-top: 4px;
    }

    .modal-confirm-text {
      text-align: center;
      margin-bottom: 16px;
      color: #fbbf24;
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* Empty / Loading */
    .empty-state, .loading-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.9rem;
      z-index: 300;
      transition: transform 0.3s ease;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast.success { border-left: 4px solid var(--green); }
    .toast.error { border-left: 4px solid var(--red); }

    .filter-count {
      font-size: 0.75rem;
      color: var(--text-muted);
      padding: 0 16px 8px;
    }

    /* Pull to refresh */
    .ptr-indicator {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 0;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      pointer-events: none;
      z-index: 150;
      transition: height 0.2s ease;
      background: linear-gradient(to bottom, rgba(15,15,26,0.95), transparent);
    }

    .ptr-content {
      padding-bottom: 14px;
      color: var(--text-muted);
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .ptr-spinner {
      width: 24px;
      height: 24px;
      border: 2.5px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    .ptr-arrow {
      font-size: 1.3rem;
      transition: transform 0.2s;
    }

    body.ptr-pulling .ptr-indicator {
      height: var(--ptr-height, 0px);
    }

    body.ptr-pulling .ptr-content {
      opacity: 1;
    }

    body.ptr-refreshing .ptr-indicator {
      height: 60px !important;
    }

    body.ptr-refreshing .ptr-content {
      opacity: 1;
    }


    .filter-toggle-row {
      margin-top: 10px;
      display: flex;
      align-items: center;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-muted);
      user-select: none;
    }

    .toggle-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--blue);
      cursor: pointer;
    }

    .toggle-label input[type="checkbox"]:checked + .toggle-text {
      color: var(--text);
    }


    .modal-btn.clear {
      background: #475569;
      color: #e2e8f0;
    }


    /* Search suggestions */
    .search-wrap {
      position: relative;
      flex: 2;
      min-width: 140px;
    }

    .search-wrap input {
      width: 100%;
    }

    .suggest-list {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: 4px;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 10px;
      max-height: 260px;
      overflow-y: auto;
      z-index: 120;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }

    .suggest-list.show {
      display: block;
    }

    .suggest-item {
      padding: 10px 12px;
      cursor: pointer;
      border-bottom: 1px solid rgba(51,65,85,0.6);
      font-size: 0.85rem;
    }

    .suggest-item:last-child {
      border-bottom: none;
    }

    .suggest-item:active,
    .suggest-item:hover {
      background: rgba(37,99,235,0.25);
    }

    .suggest-item .s-name {
      font-weight: 600;
      color: var(--text);
    }

    .suggest-item .s-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .suggest-empty {
      padding: 12px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    /* Highlight target card */
    .match-card.highlight {
      border-color: #3b82f6 !important;
      box-shadow: 0 0 0 2px rgba(59,130,246,0.45), 0 0 20px rgba(59,130,246,0.2);
      animation: highlightPulse 1.2s ease;
    }

    @keyframes highlightPulse {
      0% { box-shadow: 0 0 0 4px rgba(59,130,246,0.6); }
      100% { box-shadow: 0 0 0 2px rgba(59,130,246,0.45), 0 0 20px rgba(59,130,246,0.2); }
    }


    /* Athlete path */
    .name-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .athlete.red .name-row {
      flex-direction: row-reverse;
    }
    .path-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: rgba(148,163,184,0.2);
      color: #94a3b8;
      font-size: 0.65rem;
      cursor: pointer;
      flex-shrink: 0;
      line-height: 1;
      border: none;
      padding: 0;
    }
    .path-icon:active {
      background: rgba(59,130,246,0.4);
      color: #93c5fd;
    }

    .path-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 250;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .path-modal-overlay.show {
      display: flex;
    }
    .path-modal {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      max-height: 80vh;
      border-radius: 20px 20px 0 0;
      padding: 20px 16px 24px;
      overflow-y: auto;
      animation: slideUp 0.25s ease;
    }
    .path-modal h3 {
      text-align: center;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }
    .path-modal .path-sub {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      margin-bottom: 16px;
    }
    .path-item {
      background: rgba(0,0,0,0.25);
      border-radius: 10px;
      padding: 11px 12px;
      margin-bottom: 8px;
      border-left: 3px solid #64748b;
      cursor: pointer;
      transition: background 0.15s;
    }
    .path-item:active {
      background: rgba(59,130,246,0.15);
    }
    .path-item.won {
      border-left-color: #16a34a;
    }
    .path-item.lost {
      border-left-color: #dc2626;
      opacity: 0.7;
    }
    .path-item.pending {
      border-left-color: #64748b;
    }
    .path-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .path-item-match {
      font-weight: 700;
      color: var(--text);
      font-size: 0.88rem;
    }
    .path-item-result {
      font-size: 0.75rem;
      font-weight: 700;
    }
    .path-item-result.win { color: #4ade80; }
    .path-item-result.lose { color: #f87171; }
    .path-item-vs {
      font-size: 0.85rem;
      line-height: 1.35;
    }
    .path-item-vs .opp {
      font-weight: 600;
    }
    .path-item-vs .opp-tbd {
      color: #64748b;
      font-style: italic;
      font-weight: 400;
    }
    .path-item-dojo {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 2px;
      padding-left: 28px;
    }
    .path-modal .path-sub {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.78rem;
      margin-bottom: 4px;
      line-height: 1.4;
    }
    .path-modal .path-meta {
      text-align: center;
      color: #64748b;
      font-size: 0.72rem;
      margin-bottom: 14px;
    }
    .path-close-btn {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      font-size: 0.95rem;
      cursor: pointer;
    }


    .path-side {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      margin-right: 4px;
    }
    .path-side.blue {
      background: rgba(37,99,235,0.3);
      color: #93c5fd;
    }
    .path-side.red {
      background: rgba(220,38,38,0.3);
      color: #fca5a5;
    }

  </style>
</head>
<body>

  <div class="ptr-indicator" id="ptrIndicator">
    <div class="ptr-content">
      <div class="ptr-arrow" id="ptrArrow">↓</div>
      <div class="ptr-spinner" id="ptrSpinner" style="display:none;"></div>
      <span id="ptrText">下拉重新整理</span>
    </div>
  </div>

  <div class="header">
    <div class="header-top">
      <h1>跆拳道搏擊出線表</h1>
      <div class="header-actions">
        <button class="btn" id="btnRefresh" onclick="manualRefresh()">
          ↻ 重新整理
        </button>
      </div>
    </div>
    <div class="status-bar">
      <span>
        <span class="sync-dot" id="syncDot"></span>
        <span id="syncText">即時更新中</span>
      </span>
      <span id="lastUpdate">—</span>
    </div>
    <div class="filters">
      <select id="filterCategory">
        <option value="">全部量級</option>
      </select>
      <select id="filterRound">
        <option value="">全部輪次</option>
      </select>
      <select id="filterVenue">
        <option value="">全部場地</option>
      </select>
      <div class="search-wrap">
        <input type="text" id="filterSearch" placeholder="搜尋姓名 / 場次..." autocomplete="off">
        <div class="suggest-list" id="suggestList"></div>
      </div>
    </div>
    <div class="filter-toggle-row">
      <label class="toggle-label">
        <input type="checkbox" id="hideCompleted">
        <span class="toggle-text">隱藏已完成</span>
      </label>
    </div>
  </div>

  <div class="filter-count" id="filterCount"></div>
  <div class="match-list" id="matchList">
    <div class="loading-state">
      <div class="spinner"></div>
      正在載入資料...
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <h3 id="modalTitle">選擇勝方</h3>
      <div class="modal-match-info" id="modalInfo"></div>
      <div id="modalConfirmArea" style="display:none;"></div>
      <div class="modal-actions">
        <button class="modal-btn blue" id="btnBlueWin">🔵 藍方勝</button>
        <button class="modal-btn red" id="btnRedWin">🔴 紅方勝</button>
        <button class="modal-btn clear" id="btnClear" style="display:none;">⚪ 清除賽果</button>
        <button class="modal-btn cancel" onclick="closeModal()">取消</button>
      </div>
    </div>
  </div>

  <!-- Athlete Path Modal -->
  <div class="path-modal-overlay" id="pathModalOverlay">
    <div class="path-modal" id="pathModal">
      <h3 id="pathTitle">選手出線路徑</h3>
      <div class="path-sub" id="pathSub"></div>
      <div id="pathList"></div>
      <button class="path-close-btn" onclick="closePathModal()">關閉</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbzHs9gHGcWfzRUkadKmz-nPS_IzTqdpaANHiudtRS0YJtjC8cG4Wnd3EqZsjgjlja7H/exec';
    const REFRESH_INTERVAL = 15000;

    let allMatches = [];
    let currentMatch = null;
    let isUpdating = false;
    let refreshTimer = null;
    // 正在寫入 Google Sheet 的場次（樂觀更新保護）
    const pendingWrites = new Set();

    document.addEventListener('DOMContentLoaded', () => {
      loadData();
      startAutoRefresh();

      document.getElementById('filterCategory').addEventListener('change', renderMatches);
      document.getElementById('filterRound').addEventListener('change', renderMatches);
      document.getElementById('filterVenue').addEventListener('change', renderMatches);
      document.getElementById('filterSearch').addEventListener('input', onSearchInput);
      document.getElementById('filterSearch').addEventListener('focus', onSearchInput);
      document.getElementById('hideCompleted').addEventListener('change', renderMatches);

      // 點擊外部關閉建議
      document.addEventListener('click', (e) => {
        const wrap = document.querySelector('.search-wrap');
        if (wrap && !wrap.contains(e.target)) {
          hideSuggestions();
        }
      });
    });

    async function loadData(silent = false) {
      if (!silent) {
        document.getElementById('syncText').textContent = '更新中...';
      }

      try {
        const res = await fetch(API_URL + '?action=getMatches&t=' + Date.now());
        const json = await res.json();

        if (!json.success) throw new Error(json.error || '載入失敗');

        const incoming = json.data || [];

        // 合併：保留仍在 pending 的樂觀資料，避免被舊 Sheet 資料覆蓋
        if (pendingWrites.size > 0 && allMatches.length > 0) {
          const localMap = {};
          allMatches.forEach(m => { localMap[m.matchId] = m; });

          allMatches = incoming.map(m => {
            if (pendingWrites.has(m.matchId) && localMap[m.matchId]) {
              return localMap[m.matchId]; // 保留樂觀結果
            }
            return m;
          });
        } else {
          allMatches = incoming;
        }

        updateFilterOptions();
        renderMatches();

        document.getElementById('syncDot').classList.remove('error');
        document.getElementById('syncText').textContent = '即時更新中';
        document.getElementById('lastUpdate').textContent = 
          '最後更新：' + new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      } catch (err) {
        console.error(err);
        document.getElementById('syncDot').classList.add('error');
        document.getElementById('syncText').textContent = '連線異常';
        if (!silent) showToast('載入失敗：' + err.message, 'error');
      }
    }

    function startAutoRefresh() {
      if (refreshTimer) clearInterval(refreshTimer);
      refreshTimer = setInterval(() => {
        if (!isUpdating && !document.getElementById('modalOverlay').classList.contains('show')) {
          loadData(true);
        }
      }, REFRESH_INTERVAL);
    }

    function manualRefresh() {
      loadData(false);
    }

    function updateFilterOptions() {
      const categories = [...new Set(allMatches.map(m => m.category).filter(Boolean))].sort();
      const rounds = [...new Set(allMatches.map(m => m.round).filter(Boolean))];
      // 輪次排序：依常見比賽順序
      const roundOrder = ['16強', '8強', '4強', '準決賽', '決賽', '季軍賽'];
      rounds.sort((a, b) => {
        const ia = roundOrder.indexOf(a);
        const ib = roundOrder.indexOf(b);
        if (ia === -1 && ib === -1) return a.localeCompare(b);
        if (ia === -1) return 1;
        if (ib === -1) return -1;
        return ia - ib;
      });
      const venues = [...new Set(allMatches.map(m => m.venue).filter(Boolean))].sort();

      const catSelect = document.getElementById('filterCategory');
      const roundSelect = document.getElementById('filterRound');
      const venSelect = document.getElementById('filterVenue');

      const currentCat = catSelect.value;
      const currentRound = roundSelect ? roundSelect.value : '';
      const currentVen = venSelect.value;

      catSelect.innerHTML = '<option value="">全部量級</option>' + 
        categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
      if (roundSelect) {
        roundSelect.innerHTML = '<option value="">全部輪次</option>' + 
          rounds.map(r => `<option value="${escapeHtml(r)}">${escapeHtml(r)}</option>`).join('');
        roundSelect.value = currentRound;
      }
      venSelect.innerHTML = '<option value="">全部場地</option>' + 
        venues.map(v => `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join('');

      catSelect.value = currentCat;
      venSelect.value = currentVen;
    }

    function getFilteredMatches() {
      const cat = document.getElementById('filterCategory').value;
      const round = document.getElementById('filterRound')?.value || '';
      const ven = document.getElementById('filterVenue').value;
      const search = document.getElementById('filterSearch').value.trim().toLowerCase();
      const hideCompleted = document.getElementById('hideCompleted').checked;

      return allMatches.filter(m => {
        if (cat && m.category !== cat) return false;
        if (round && m.round !== round) return false;
        if (ven && m.venue !== ven) return false;
        if (hideCompleted) {
          const hasResult = m.blue?.result === '勝方' || m.red?.result === '勝方' || m.status === '已完成';
          if (hasResult) return false;
        }
        if (search) {
          const text = [
            m.matchId, m.category, m.round,
            m.blue?.name, m.red?.name,
            m.blue?.dojo, m.red?.dojo
          ].join(' ').toLowerCase();
          if (!text.includes(search)) return false;
        }
        return true;
      });
    }

    function renderMatches() {
      const list = document.getElementById('matchList');
      const filtered = getFilteredMatches();

      document.getElementById('filterCount').textContent = 
        `顯示 ${filtered.length} / ${allMatches.length} 場`;

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-state">沒有符合條件的比賽</div>`;
        return;
      }

      list.innerHTML = filtered.map(m => {
        const blueWin = m.blue?.result === '勝方';
        const redWin = m.red?.result === '勝方';
        const hasResult = blueWin || redWin || m.status === '已完成';

        let cardClass = 'pending';
        if (m.status === '進行中') cardClass = 'ongoing';
        else if (hasResult) cardClass = 'completed';

        let vsContent = 'VS';
        if (blueWin) vsContent = `<div class="vs-result result-win-blue">藍勝</div>`;
        else if (redWin) vsContent = `<div class="vs-result result-win-red">紅勝</div>`;

        return `
          <div class="match-card ${cardClass}" data-match-id="${escapeHtml(m.matchId)}" onclick="openMatchModal('${escapeHtml(m.matchId)}')">
            <div class="match-header">
              <div>
                <span class="match-id">${escapeHtml(m.matchId)}</span>
                <span style="margin-left:8px">${escapeHtml(m.round || '')}</span>
              </div>
              <div class="match-meta">
                <span>${escapeHtml(m.venue || '')}${m.time ? ' · ' + escapeHtml(m.time) : ''}</span>
                <span class="badge badge-status-${escapeHtml(m.status || '未開始')}">${escapeHtml(m.status || '未開始')}</span>
              </div>
            </div>
            <div class="athletes">
              <div class="athlete blue ${blueWin ? 'winner' : ''} ${redWin ? 'loser' : ''}">
                <div class="name-row">
                  <div class="athlete-name">${escapeHtml(m.blue?.name || '—')}</div>
                  ${m.blue?.name && m.blue.name !== '—' ? `<button class="path-icon" data-athlete="${escapeHtml(m.blue.name)}" onclick="event.stopPropagation();showAthletePath('${escapeHtml(m.blue.name)}')" title="出線路徑">↗</button>` : ''}
                </div>
                <div class="athlete-info">
                  ${escapeHtml(m.blue?.dojo || '')}<br>
                  ${escapeHtml(m.blue?.athleteNo || '')}
                  ${m.blue?.previousMatch && m.blue.previousMatch !== 'N/A' ? '<br>← ' + escapeHtml(m.blue.previousMatch) : ''}
                </div>
              </div>
              <div class="vs">${vsContent}</div>
              <div class="athlete red ${redWin ? 'winner' : ''} ${blueWin ? 'loser' : ''}">
                <div class="name-row">
                  <div class="athlete-name">${escapeHtml(m.red?.name || '—')}</div>
                  ${m.red?.name && m.red.name !== '—' ? `<button class="path-icon" data-athlete="${escapeHtml(m.red.name)}" onclick="event.stopPropagation();showAthletePath('${escapeHtml(m.red.name)}')" title="出線路徑">↗</button>` : ''}
                </div>
                <div class="athlete-info">
                  ${escapeHtml(m.red?.dojo || '')}<br>
                  ${escapeHtml(m.red?.athleteNo || '')}
                  ${m.red?.previousMatch && m.red.previousMatch !== 'N/A' ? '<br>← ' + escapeHtml(m.red.previousMatch) : ''}
                </div>
              </div>
            </div>
            <div class="category-bar">
              <span>${escapeHtml(m.category || '')}</span>
              <span>${hasResult ? (blueWin ? '藍方勝出' : redWin ? '紅方勝出' : '') : ''}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function openMatchModal(matchId) {
      const match = allMatches.find(m => m.matchId === matchId);
      if (!match) return;

      currentMatch = match;
      const hasResult = match.blue?.result === '勝方' || match.red?.result === '勝方' || match.status === '已完成';

      document.getElementById('modalTitle').textContent = hasResult ? '更改賽果' : '選擇勝方';
      document.getElementById('modalInfo').innerHTML = `
        <strong>${escapeHtml(match.matchId)}</strong> · ${escapeHtml(match.category)}<br>
        ${escapeHtml(match.blue?.name || '—')} vs ${escapeHtml(match.red?.name || '—')}
      `;

      const confirmArea = document.getElementById('modalConfirmArea');
      const btnClear = document.getElementById('btnClear');

      if (hasResult) {
        confirmArea.style.display = 'block';
        confirmArea.innerHTML = `
          <div class="modal-confirm-text">此場已有賽果，確定要更改嗎？</div>
          <button class="modal-btn blue" style="width:100%;margin-bottom:8px" onclick="showWinnerButtons()">確定更改</button>
        `;
        document.getElementById('btnBlueWin').style.display = 'none';
        document.getElementById('btnRedWin').style.display = 'none';
        btnClear.style.display = 'none';
      } else {
        confirmArea.style.display = 'none';
        document.getElementById('btnBlueWin').style.display = 'block';
        document.getElementById('btnRedWin').style.display = 'block';
        btnClear.style.display = 'none';
      }

      document.getElementById('modalOverlay').classList.add('show');
    }

    function showWinnerButtons() {
      document.getElementById('modalConfirmArea').style.display = 'none';
      document.getElementById('btnBlueWin').style.display = 'block';
      document.getElementById('btnRedWin').style.display = 'block';
      document.getElementById('btnClear').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('show');
      currentMatch = null;
    }

    document.getElementById('btnBlueWin').addEventListener('click', () => submitResult('藍'));
    document.getElementById('btnRedWin').addEventListener('click', () => submitResult('紅'));
    document.getElementById('btnClear').addEventListener('click', () => submitResult('clear'));

    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modalOverlay')) closeModal();
    });

    /**
     * 樂觀更新：先改畫面，再背景寫入 Google Sheet
     */
    async function submitResult(side) {
      if (!currentMatch) return;

      const matchId = currentMatch.matchId;
      const matchIndex = allMatches.findIndex(m => m.matchId === matchId);
      if (matchIndex === -1) return;

      // 備份舊資料，失敗時還原
      const backup = JSON.parse(JSON.stringify(allMatches[matchIndex]));

      // === 樂觀更新本地資料 ===
      const m = allMatches[matchIndex];
      if (side === 'clear') {
        if (m.blue) m.blue.result = '';
        if (m.red) m.red.result = '';
        m.status = '未開始';
      } else if (side === '藍') {
        if (m.blue) m.blue.result = '勝方';
        if (m.red) m.red.result = '負方';
        m.status = '已完成';
      } else if (side === '紅') {
        if (m.blue) m.blue.result = '負方';
        if (m.red) m.red.result = '勝方';
        m.status = '已完成';
      }

      // 標記為寫入中，防止被舊資料覆蓋
      pendingWrites.add(matchId);

      // 只更新這一張卡片（避免整頁閃爍）
      updateSingleCard(matchId);
      closeModal();
      showToast(side === 'clear' ? '已清除賽果' : `已記錄${side}方勝`, 'success');

      // === 背景寫入 Google Sheet ===
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            matchId: matchId,
            winnerSide: side
          })
        });

        const json = await res.json();

        if (!json.success) throw new Error(json.error || '更新失敗');

        // 寫入成功，解除保護
        pendingWrites.delete(matchId);

      } catch (err) {
        console.error(err);
        // 還原
        pendingWrites.delete(matchId);
        allMatches[matchIndex] = backup;
        updateSingleCard(matchId);
        showToast('儲存失敗，已還原：' + err.message, 'error');
      }
    }

    /**
     * 只更新指定場次的那一張卡片，避免整頁重繪
     */
    function updateSingleCard(matchId) {
      const card = document.querySelector(`.match-card[data-match-id="${matchId}"]`);
      if (!card) {
        // 找不到就退回整頁渲染
        renderMatches();
        return;
      }

      const m = allMatches.find(x => x.matchId === matchId);
      if (!m) return;

      const blueWin = m.blue?.result === '勝方';
      const redWin = m.red?.result === '勝方';
      const hasResult = blueWin || redWin || m.status === '已完成';

      let cardClass = 'pending';
      if (m.status === '進行中') cardClass = 'ongoing';
      else if (hasResult) cardClass = 'completed';

      let vsContent = 'VS';
      if (blueWin) vsContent = `<div class="vs-result result-win-blue">藍勝</div>`;
      else if (redWin) vsContent = `<div class="vs-result result-win-red">紅勝</div>`;

      // 更新 class
      card.className = `match-card ${cardClass}`;

      // 更新狀態 badge
      const badge = card.querySelector('.badge');
      if (badge) {
        badge.className = `badge badge-status-${escapeHtml(m.status || '未開始')}`;
        badge.textContent = m.status || '未開始';
      }

      // 更新 athletes 區域
      const athletesEl = card.querySelector('.athletes');
      if (athletesEl) {
        athletesEl.innerHTML = `
          <div class="athlete blue ${blueWin ? 'winner' : ''} ${redWin ? 'loser' : ''}">
            <div class="name-row">
              <div class="athlete-name">${escapeHtml(m.blue?.name || '—')}</div>
              ${m.blue?.name && m.blue.name !== '—' ? `<button class="path-icon" data-athlete="${escapeHtml(m.blue.name)}" onclick="event.stopPropagation();showAthletePath('${escapeHtml(m.blue.name)}')" title="出線路徑">↗</button>` : ''}
            </div>
            <div class="athlete-info">
              ${escapeHtml(m.blue?.dojo || '')}<br>
              ${escapeHtml(m.blue?.athleteNo || '')}
              ${m.blue?.previousMatch && m.blue.previousMatch !== 'N/A' ? '<br>← ' + escapeHtml(m.blue.previousMatch) : ''}
            </div>
          </div>
          <div class="vs">${vsContent}</div>
          <div class="athlete red ${redWin ? 'winner' : ''} ${blueWin ? 'loser' : ''}">
            <div class="name-row">
              <div class="athlete-name">${escapeHtml(m.red?.name || '—')}</div>
              ${m.red?.name && m.red.name !== '—' ? `<button class="path-icon" data-athlete="${escapeHtml(m.red.name)}" onclick="event.stopPropagation();showAthletePath('${escapeHtml(m.red.name)}')" title="出線路徑">↗</button>` : ''}
            </div>
            <div class="athlete-info">
              ${escapeHtml(m.red?.dojo || '')}<br>
              ${escapeHtml(m.red?.athleteNo || '')}
              ${m.red?.previousMatch && m.red.previousMatch !== 'N/A' ? '<br>← ' + escapeHtml(m.red.previousMatch) : ''}
            </div>
          </div>
        `;
      }

      // 更新底部結果文字
      const catBar = card.querySelector('.category-bar');
      if (catBar) {
        const rightSpan = catBar.querySelector('span:last-child');
        if (rightSpan) {
          rightSpan.textContent = hasResult ? (blueWin ? '藍方勝出' : redWin ? '紅方勝出' : '') : '';
        }
      }
    }


    // ========== Search Suggestions (方案 A) ==========
    function onSearchInput() {
      const q = document.getElementById('filterSearch').value.trim().toLowerCase();
      // 同時維持原本的列表過濾
      renderMatches();

      if (!q || q.length < 1) {
        hideSuggestions();
        return;
      }

      const results = [];
      const seen = new Set();

      for (const m of allMatches) {
        const candidates = [];
        if (m.blue?.name) candidates.push({ name: m.blue.name, dojo: m.blue.dojo || '', side: '藍' });
        if (m.red?.name) candidates.push({ name: m.red.name, dojo: m.red.dojo || '', side: '紅' });

        // 場次編號匹配
        if (m.matchId && m.matchId.toLowerCase().includes(q)) {
          const key = m.matchId;
          if (!seen.has(key)) {
            seen.add(key);
            results.push({
              matchId: m.matchId,
              title: m.matchId,
              meta: `${m.round || ''} · ${m.category || ''} · ${m.venue || ''}`,
              type: 'match'
            });
          }
        }

        for (const c of candidates) {
          if (!c.name || c.name === '—' || c.name.includes('勝方') || c.name === 'Bye') continue;
          if (c.name.toLowerCase().includes(q) || (c.dojo && c.dojo.toLowerCase().includes(q))) {
            const key = m.matchId + '|' + c.name;
            if (!seen.has(key)) {
              seen.add(key);
              results.push({
                matchId: m.matchId,
                title: c.name,
                meta: `${c.dojo} · ${m.matchId} · ${m.round || ''}`,
                type: 'athlete'
              });
            }
          }
        }

        if (results.length >= 8) break;
      }

      showSuggestions(results);
    }

    function showSuggestions(results) {
      const list = document.getElementById('suggestList');
      if (!list) return;

      if (results.length === 0) {
        list.innerHTML = '<div class="suggest-empty">沒有符合的結果</div>';
        list.classList.add('show');
        return;
      }

      list.innerHTML = results.map(r => `
        <div class="suggest-item" onclick="selectSuggestion('${escapeHtml(r.matchId)}')">
          <div class="s-name">${escapeHtml(r.title)}</div>
          <div class="s-meta">${escapeHtml(r.meta)}</div>
        </div>
      `).join('');
      list.classList.add('show');
    }

    function hideSuggestions() {
      const list = document.getElementById('suggestList');
      if (list) list.classList.remove('show');
    }

    function selectSuggestion(matchId) {
      hideSuggestions();
      // 清掉搜尋，顯示全部（或保留過濾也可，這裡選擇跳轉為主）
      document.getElementById('filterSearch').value = '';
      renderMatches();

      // 等 DOM 更新後再滾動
      setTimeout(() => {
        const card = document.querySelector(`.match-card[data-match-id="${matchId}"]`);
        if (!card) {
          showToast('找不到該場次', 'error');
          return;
        }
        // 移除舊高亮
        document.querySelectorAll('.match-card.highlight').forEach(el => el.classList.remove('highlight'));
        card.classList.add('highlight');
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });

        // 3 秒後取消高亮
        setTimeout(() => card.classList.remove('highlight'), 3000);
      }, 50);
    }


    // ========== Athlete Path (出線路徑) ==========
    function showAthletePath(athleteName) {
      if (!athleteName || athleteName === '—') return;

      const path = findAthletePath(athleteName);
      if (path.length === 0) {
        showToast('找不到此選手的場次', 'error');
        return;
      }

      const first = path[0];
      document.getElementById('pathTitle').textContent = athleteName;

      // 標題層次：量級一行，場地時間一行
      const subEl = document.getElementById('pathSub');
      subEl.innerHTML = escapeHtml(first.category || '');
      
      // 確保有 pathMeta 元素
      let metaEl = document.getElementById('pathMeta');
      if (!metaEl) {
        metaEl = document.createElement('div');
        metaEl.id = 'pathMeta';
        metaEl.className = 'path-meta';
        subEl.after(metaEl);
      }
      metaEl.textContent = `${first.venue || ''} · ${first.time || ''} · 共 ${path.length} 場`;

      const list = document.getElementById('pathList');
      list.innerHTML = path.map(p => {
        let statusClass = 'pending';
        let resultHtml = '';
        if (p.athleteResult === '勝方') {
          statusClass = 'won';
          resultHtml = '<span class="path-item-result win">勝</span>';
        } else if (p.athleteResult === '負方') {
          statusClass = 'lost';
          resultHtml = '<span class="path-item-result lose">負</span>';
        }

        const oppIsTbd = !p.opponent || p.opponent.includes('勝方') || p.opponent === 'Bye' || p.opponent === '—';
        const oppHtml = oppIsTbd
          ? `<span class="opp-tbd">${escapeHtml(p.opponent || '待定')}</span>`
          : `<span class="opp">${escapeHtml(p.opponent)}</span>`;

        const sideHtml = p.side
          ? `<span class="path-side ${p.side === '藍' ? 'blue' : 'red'}">${p.side}</span>`
          : '';

        const dojoHtml = (p.opponentDojo && !oppIsTbd)
          ? `<div class="path-item-dojo">${escapeHtml(p.opponentDojo)}</div>`
          : '';

        return `
          <div class="path-item ${statusClass}" data-match-id="${escapeHtml(p.matchId)}" onclick="jumpToMatch('${escapeHtml(p.matchId)}')">
            <div class="path-item-header">
              <span class="path-item-match">${escapeHtml(p.round || '')} · ${escapeHtml(p.matchId)}</span>
              ${resultHtml}
            </div>
            <div class="path-item-vs">
              ${sideHtml}vs ${oppHtml}
            </div>
            ${dojoHtml}
          </div>
        `;
      }).join('');

      document.getElementById('pathModalOverlay').classList.add('show');
    }

    function jumpToMatch(matchId) {
      closePathModal();
      // 清掉搜尋，讓卡片較容易出現
      const searchInput = document.getElementById('filterSearch');
      if (searchInput && searchInput.value) {
        searchInput.value = '';
        hideSuggestions();
        renderMatches();
      }

      setTimeout(() => {
        const card = document.querySelector(`.match-card[data-match-id="${matchId}"]`);
        if (!card) {
          showToast('找不到該場次（可能被篩選隱藏）', 'error');
          return;
        }
        document.querySelectorAll('.match-card.highlight').forEach(el => el.classList.remove('highlight'));
        card.classList.add('highlight');
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => card.classList.remove('highlight'), 3000);
      }, 80);
    }

    function closePathModal() {
      document.getElementById('pathModalOverlay').classList.remove('show');
    }

    document.getElementById('pathModalOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('pathModalOverlay')) closePathModal();
    });

    function findAthletePath(athleteName) {
      const path = [];
      const visited = new Set();

      // 若是「A106勝方」這類佔位，從該場次往後追
      const placeholderMatch = athleteName.match(/^([A-Za-z0-9\-]+)勝方$/);
      if (placeholderMatch) {
        const fromId = placeholderMatch[1];
        // 找出所有 previousMatch = fromId 的場次，以及名稱為 athleteName 的場次
        const startMatches = allMatches.filter(m => {
          return m.matchId === fromId
            || m.blue?.name === athleteName
            || m.red?.name === athleteName
            || m.blue?.previousMatch === fromId
            || m.red?.previousMatch === fromId;
        });
        startMatches.sort((a, b) => a.matchId.localeCompare(b.matchId));

        for (const m of startMatches) {
          if (visited.has(m.matchId)) continue;
          // 對於來源場 fromId，若選手尚未決出，仍顯示該場
          addMatchToPath(m, athleteName, path, visited);

          let currentId = m.matchId;
          let safety = 0;
          while (safety < 20) {
            safety++;
            const next = allMatches.find(nm => {
              if (visited.has(nm.matchId)) return false;
              const prevBlue = nm.blue?.previousMatch || '';
              const prevRed = nm.red?.previousMatch || '';
              return prevBlue === currentId || prevRed === currentId;
            });
            if (!next) break;
            addMatchToPath(next, athleteName, path, visited);
            currentId = next.matchId;
          }
        }
        path.sort((a, b) => a.matchId.localeCompare(b.matchId));
        return path;
      }

      // 一般真實姓名
      const directMatches = allMatches.filter(m => {
        return (m.blue?.name === athleteName) || (m.red?.name === athleteName);
      });
      directMatches.sort((a, b) => a.matchId.localeCompare(b.matchId));

      for (const m of directMatches) {
        if (visited.has(m.matchId)) continue;
        addMatchToPath(m, athleteName, path, visited);

        let currentId = m.matchId;
        let safety = 0;
        while (safety < 20) {
          safety++;
          const next = allMatches.find(nm => {
            if (visited.has(nm.matchId)) return false;
            const prevBlue = nm.blue?.previousMatch || '';
            const prevRed = nm.red?.previousMatch || '';
            return prevBlue === currentId || prevRed === currentId;
          });
          if (!next) break;
          addMatchToPath(next, athleteName, path, visited);
          currentId = next.matchId;
        }
      }

      path.sort((a, b) => a.matchId.localeCompare(b.matchId));
      return path;
    }

    function addMatchToPath(m, athleteName, path, visited) {
      if (visited.has(m.matchId)) return;
      visited.add(m.matchId);

      const isBlue = m.blue?.name === athleteName;
      const isRed = m.red?.name === athleteName;
      const placeholderMatch = athleteName.match(/^([A-Za-z0-9\-]+)勝方$/);
      const fromId = placeholderMatch ? placeholderMatch[1] : null;

      let athleteResult = '';
      let opponent = '';
      let opponentDojo = '';
      let side = '';

      if (isBlue) {
        athleteResult = m.blue?.result || '';
        opponent = m.red?.name || '—';
        opponentDojo = m.red?.dojo || '';
        side = '藍';
      } else if (isRed) {
        athleteResult = m.red?.result || '';
        opponent = m.blue?.name || '—';
        opponentDojo = m.blue?.dojo || '';
        side = '紅';
      } else if (fromId) {
        // 佔位：根據 previousMatch 或名稱判斷邊
        if (m.blue?.previousMatch === fromId || m.blue?.name === athleteName) {
          side = '藍';
          opponent = m.red?.name || '—';
          opponentDojo = m.red?.dojo || '';
          athleteResult = m.blue?.result || '';
        } else if (m.red?.previousMatch === fromId || m.red?.name === athleteName) {
          side = '紅';
          opponent = m.blue?.name || '—';
          opponentDojo = m.blue?.dojo || '';
          athleteResult = m.red?.result || '';
        } else if (m.matchId === fromId) {
          // 來源場本身：顯示該場兩邊概要
          opponent = (m.blue?.name || '—') + ' vs ' + (m.red?.name || '—');
          side = '';
        } else {
          const blueName = m.blue?.name || '—';
          const redName = m.red?.name || '—';
          if (blueName.includes('勝方')) {
            side = '藍';
            opponent = redName;
            opponentDojo = m.red?.dojo || '';
          } else {
            side = '紅';
            opponent = blueName;
            opponentDojo = m.blue?.dojo || '';
          }
        }
      } else {
        const blueName = m.blue?.name || '—';
        const redName = m.red?.name || '—';
        if (blueName.includes('勝方')) {
          side = '藍';
          opponent = redName;
          opponentDojo = m.red?.dojo || '';
        } else if (redName.includes('勝方')) {
          side = '紅';
          opponent = blueName;
          opponentDojo = m.blue?.dojo || '';
        } else {
          opponent = redName !== '—' ? redName : blueName;
        }
      }

      path.push({
        matchId: m.matchId,
        round: m.round,
        category: m.category,
        venue: m.venue,
        time: m.time,
        status: m.status,
        athleteResult,
        opponent,
        opponentDojo,
        side
      });
    }


    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast show ' + type;
      setTimeout(() => toast.classList.remove('show'), 2800);
    }

    function debounce(fn, delay) {
      let timer;
      return function(...args) {
        clearTimeout(timer);
        timer = setTimeout(() => fn.apply(this, args), delay);
      };
    }

    // ========== Pull to Refresh (支援 PWA 主畫面模式) ==========
    (function() {
      const THRESHOLD = 65;
      let startY = 0;
      let currentY = 0;
      let pulling = false;
      let refreshing = false;

      const arrow = document.getElementById('ptrArrow');
      const spinner = document.getElementById('ptrSpinner');
      const text = document.getElementById('ptrText');

      function isAtTop() {
        return (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0) <= 2;
      }

      // 使用 touchstart / touchmove / touchend 在 document 與 body 都監聽，提高 PWA 相容性
      function onTouchStart(e) {
        if (refreshing || isUpdating) return;
        if (!isAtTop()) return;
        if (e.touches.length !== 1) return;
        startY = e.touches[0].clientY;
        currentY = startY;
        pulling = true;
      }

      function onTouchMove(e) {
        if (!pulling || refreshing || isUpdating) return;
        if (!isAtTop()) {
          pulling = false;
          resetPtr();
          return;
        }

        currentY = e.touches[0].clientY;
        const diff = currentY - startY;

        if (diff > 8) {
          // 阻止瀏覽器預設的 overscroll 行為（部分 PWA 需要）
          if (e.cancelable) e.preventDefault();

          const height = Math.min(diff * 0.5, 90);
          document.body.classList.add('ptr-pulling');
          document.body.style.setProperty('--ptr-height', height + 'px');

          if (height >= THRESHOLD) {
            arrow.style.transform = 'rotate(180deg)';
            text.textContent = '放開以重新整理';
          } else {
            arrow.style.transform = 'rotate(0deg)';
            text.textContent = '下拉重新整理';
          }
        }
      }

      async function onTouchEnd() {
        if (!pulling || refreshing) return;
        pulling = false;

        const diff = currentY - startY;
        const height = Math.min(diff * 0.5, 90);

        if (height >= THRESHOLD && !isUpdating) {
          refreshing = true;
          document.body.classList.remove('ptr-pulling');
          document.body.classList.add('ptr-refreshing');
          arrow.style.display = 'none';
          spinner.style.display = 'block';
          text.textContent = '更新中...';

          try {
            await loadData(true);
            showToast('已更新', 'success');
          } catch (e) {}

          setTimeout(() => {
            refreshing = false;
            resetPtr();
          }, 450);
        } else {
          resetPtr();
        }
      }

      // passive: false 才能 preventDefault（對部分 iOS PWA 重要）
      document.addEventListener('touchstart', onTouchStart, { passive: true });
      document.addEventListener('touchmove', onTouchMove, { passive: false });
      document.addEventListener('touchend', onTouchEnd, { passive: true });
      document.addEventListener('touchcancel', onTouchEnd, { passive: true });

      function resetPtr() {
        document.body.classList.remove('ptr-pulling', 'ptr-refreshing');
        document.body.style.removeProperty('--ptr-height');
        arrow.style.display = 'block';
        arrow.style.transform = 'rotate(0deg)';
        spinner.style.display = 'none';
        text.textContent = '下拉重新整理';
        startY = 0;
        currentY = 0;
      }
    })();

  </script>
</body>
